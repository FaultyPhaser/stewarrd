name: Release image

# Pushing a tag like v0.1.0-alpha.1 publishes ghcr.io/<owner>/stewarrd:<version>.
# Pre-release tags also move the matching channel tag (alpha/beta). `latest` only moves on stable releases.
# Pushes to main publish the `edge` tag.
on:
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stewarrd
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=alpha,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-alpha') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-beta') }}
            type=edge,branch=main
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
