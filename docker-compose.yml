services:
  stewarrd:
    # Prebuilt image. Pin an exact version (e.g. :0.1.0-alpha.1) to control upgrades,
    # or comment out `image` and uncomment `build` to build from source.
    image: ghcr.io/faultyphaser/stewarrd:alpha
    # build: .
    container_name: stewarrd
    user: "1000:1000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Application state only. Do NOT mount media storage paths.
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=1
      - SEERR_URL=${SEERR_URL:-http://seerr:5055}
      - SEERR_API_KEY=${SEERR_API_KEY}
      - ADMIN_USER_ID=${ADMIN_USER_ID:-1}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - RADARR_URL=${RADARR_URL:-http://radarr:7878}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=${SONARR_URL:-http://sonarr:8989}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - DEFAULT_CREDITS=${DEFAULT_CREDITS:-3}
      - CREDIT_COST_MOVIE=${CREDIT_COST_MOVIE:-1}
      - CREDIT_COST_TV_SEASON=${CREDIT_COST_TV_SEASON:-2}
      - MIN_STEWARDSHIP_DAYS=${MIN_STEWARDSHIP_DAYS:-30}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
