# Add inside the server block that fronts Seerr.
# Assumes nginx runs on the host (or shares a network namespace) so 127.0.0.1:3000 reaches the sidecar.

# Sidecar API for inject.js. Same origin as Seerr, so the Seerr session cookie is sent along.
# The webhook and admin-free Kometa endpoint are intentionally NOT exposed here.
location /sidecar-api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Static assets (inject.js). no-cache makes browsers revalidate, so a rebuilt image is picked up at once.
location /sidecar-assets/ {
    proxy_pass http://127.0.0.1:3000/public/;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache";
}

# Optional: Stewarrd dashboard at /stewarrd/
location = /stewarrd {
    return 301 /stewarrd/;
}
location /stewarrd/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
}

# Seerr itself, with the script injected
location / {
    proxy_pass http://seerr:5055;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding ""; # Prevents compression so sub_filter can rewrite the body

    sub_filter '</head>' '<script src="/sidecar-assets/inject.js" defer></script></head>';
    sub_filter_once on;
}
